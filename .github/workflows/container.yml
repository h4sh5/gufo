name: Container image

# Build the Dockerfile and publish the image to GitHub Container Registry.
# The Dockerfile's runtime stage inherits the pinned ROCm userspace, so the
# image keeps /opt/rocm and its HIP/hipBLAS/rocBLAS libraries; its RUN checks
# fail the build if `ldd` reports a missing library. Keep those layers intact:
# no squash, prune or slim pass runs on the image here.
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      revision:
        description: Revision to build (defaults to the selected ref)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.revision || github.ref }}
          persist-credentials: false

      # The ROCm image plus a gfx1151 build needs more than the runner's
      # default free space. Remove unused host toolchains only; everything the
      # final image carries, including /opt/rocm, lives in its own layers.
      - name: Free disk space
        run: |
          sudo rm -rf \
            /opt/az \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet \
            /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - name: Resolve build metadata
        id: build
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(cat version.txt)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GUFO_RELEASE_VERSION=${{ steps.build.outputs.version }}
            GUFO_REVISION=${{ steps.build.outputs.revision }}
          cache-from: type=gha,scope=gufo-image
          cache-to: type=gha,mode=max,scope=gufo-image

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
